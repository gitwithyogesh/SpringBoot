<!DOCTYPE html>
<html 
 xmlns:th="http://www.thymeleaf.org"
 xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{base}">

<div layout:fragment="content">

<div class="bill-box" style="width:60%; margin:30px auto; border:1px solid #000; padding:20px;">
    <h2 style="text-align:center;">RE Motors — Invoice</h2>
    <hr>

    <p><strong>Invoice No:</strong> INV-<span id="invoiceNo"></span></p>
    <p><strong>Date:</strong> <span id="date"></span></p>
    <p><strong>Customer:</strong> <span id="customerName"></span></p>

    <table style="width:100%; border-collapse: collapse; margin-top:10px;">
        <thead>
            <tr>
                <th style="border:1px solid #ccc; padding:8px;">Bike</th>
                <th style="border:1px solid #ccc; padding:8px;">Price (₹)</th>
            </tr>
        </thead>
        <tbody id="billTable"></tbody>
    </table>

    <h3 style="text-align:right;">Total: ₹<span id="billTotal">0</span></h3>

    <button onclick="window.print()" 
      style="padding:10px 15px; background:blue; color:white; border:none;">
        Print Invoice
    </button>
</div>

<!-- VERY IMPORTANT: LOAD BILL ONLY AFTER PAGE CONTENT IS READY -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const bill = JSON.parse(localStorage.getItem("finalBill")) || [];
    let total = 0;

    // Invoice No
    document.getElementById("invoiceNo").textContent =
        Math.floor(100000 + Math.random() * 900000);

    // Date
    document.getElementById("date").textContent =
        new Date().toLocaleDateString();

    // Customer Name
    const username = localStorage.getItem("loggedInUser") || "Guest";
    document.getElementById("customerName").textContent = username;

    const table = document.getElementById("billTable");

    if (bill.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="2" style="text-align:center;">No items in bill</td>
            </tr>
        `;
        document.getElementById("billTotal").textContent = "0";
        return;
    }

    bill.forEach(item => {
        total += item.price;
        table.innerHTML += `
            <tr>
                <td style="border:1px solid #ccc; padding:8px;">${item.name}</td>
                <td style="border:1px solid #ccc; padding:8px;">${item.price}</td>
            </tr>
        `;
    });

    document.getElementById("billTotal").textContent = total;
});
</script>

</div>
</html>
